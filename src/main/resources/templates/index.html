<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReviewCheck 모의면접</title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="wrap">
  <h1>ReviewCheck 모의면접</h1>
  <p class="sub">GitHub 레포 링크를 붙여넣으면 AI 면접관이 코드를 읽고 기술 면접을 진행해요.</p>

  <div class="error" th:if="${error}" th:text="${error}"></div>

  <div class="card">
    <form class="start" method="post" th:action="@{/interview}" data-loading>
      <input type="url" name="repoUrl" required placeholder="https://github.com/아이디/레포이름"
             th:value="${repoUrl}" autofocus>
      <span class="code-field">
        <input type="password" name="accessCode" id="accessCode" required placeholder="접속 코드"
               autocomplete="off" maxlength="100">
        <!-- 눈 아이콘: 누르면 접속 코드가 보이고, 다시 누르면 가려진다 -->
        <button type="button" class="toggle-code" data-target="accessCode" aria-label="접속 코드 보기">
          <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </span>
      <button type="submit">면접 시작</button>
    </form>
    <p class="hint">
      <span class="loading">레포를 읽고 첫 질문을 준비하는 중이에요… (30초 정도 걸릴 수 있어요)</span>
      <span class="idle">공개 레포만 가능해요. 질문은 5개, 답변마다 피드백을 받고 마지막에 총평이 나와요.</span>
    </p>
  </div>
</main>
<script th:src="@{/app.js}"></script>
</body>
</html>
