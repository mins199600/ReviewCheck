spring.application.name=ReviewCheck
server.port=${PORT:8080}

# 래디스 설정
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# 디비 설정
spring.datasource.url=jdbc:mariadb://localhost:3306/reviewcheck
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Claude API 키는 환경변수 ANTHROPIC_API_KEY 로 넣는다. (여기에 직접 적지 말 것)
interview.model=claude-opus-5-5
# 한 번의 면접에서 낼 메인 질문 수
interview.question-count=5

# ===== 비용 보호 =====
# 면접 시작에 필요한 접속 코드. 환경변수 INTERVIEW_ACCESS_CODE 로 넣는다. (비어 있으면 아무도 시작할 수 없음)
interview.access-code=${INTERVIEW_ACCESS_CODE:}
# 같은 IP가 하루에 시작할 수 있는 면접 수
interview.max-starts-per-ip-per-day=3
# 서비스 전체에서 하루에 시작할 수 있는 면접 수
interview.max-starts-per-day=20
# 답변 한 번에 쓸 수 있는 최대 글자 수
interview.max-answer-chars=3000
# 동시에 메모리에 둘 수 있는 면접 수, 면접 보관 시간(분)
interview.max-active-sessions=50
interview.session-ttl-minutes=120

# GitHub API 요청 한도를 늘리고 싶으면 환경변수 GITHUB_TOKEN 설정 (공개 레포만 볼 거면 없어도 됨)
github.token=${GITHUB_TOKEN:}
# 레포에서 읽어올 파일 수 / 총 글자 수 상한
github.max-files=60
github.max-chars=200000
